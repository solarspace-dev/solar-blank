name: Update Tool Versions

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

jobs:
  update-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest versions and update Dockerfile
        id: update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request

          DOCKERFILE = ".devcontainer/Dockerfile"

          def fetch_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def github_latest_release(owner, repo, token):
              url = f"https://api.github.com/repos/{owner}/{repo}/releases/latest"
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              data = fetch_json(url, headers)
              return data["tag_name"]

          def github_latest_prerelease_tag(owner, repo, token):
              """Return the tag of the most-recently published release (including pre-releases)."""
              url = f"https://api.github.com/repos/{owner}/{repo}/releases?per_page=1"
              headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"}
              releases = fetch_json(url, headers)
              return releases[0]["tag_name"]

          def pypi_latest(package):
              data = fetch_json(f"https://pypi.org/pypi/{package}/json")
              return data["info"]["version"]

          def npm_latest(package):
              data = fetch_json(f"https://registry.npmjs.org/{package}/latest")
              return data["version"]

          token = os.environ["GH_TOKEN"]

          # ── Fetch all latest versions ─────────────────────────────────────────
          versions = {
              "ECHIDNA_VERSION":       github_latest_release("crytic", "echidna", token),
              "PYTHON_VERSION":        None,  # handled specially below
              "UV_VERSION":            pypi_latest("uv"),
              "NVM_VERSION":           github_latest_release("nvm-sh", "nvm", token).lstrip("v"),
              "NODE_VERSION":          None,  # handled specially below
              "PNPM_VERSION":          npm_latest("pnpm"),
              "HARDHAT_VERSION":       npm_latest("hardhat"),
              "SLITHER_VERSION":       pypi_latest("slither-analyzer"),
              "CRYTIC_COMPILE_VERSION": pypi_latest("crytic-compile"),
              "VYPER_VERSION":         pypi_latest("vyper"),
              "SLITHER_LSP_VERSION":   pypi_latest("slither-lsp"),
              "SEMGREP_VERSION":       pypi_latest("semgrep"),
              "SLITHERIN_VERSION":     pypi_latest("slitherin"),
              "SOLC_SELECT_VERSION":   pypi_latest("solc-select"),
              "HALMOS_VERSION":        pypi_latest("halmos"),
              "FOUNDRY_VERSION":       github_latest_release("foundry-rs", "foundry", token),
              "ADERYN_VERSION":        github_latest_release("Cyfrin", "aderyn", token).removeprefix("aderyn-v"),
              "ITYFUZZ_NIGHTLY":       github_latest_prerelease_tag("fuzzland", "ityfuzz", token),
          }

          # Resolve latest Node.js LTS version
          node_index = fetch_json("https://nodejs.org/dist/index.json")
          lts_releases = [r for r in node_index if r.get("lts")]
          versions["NODE_VERSION"] = lts_releases[0]["version"].lstrip("v")

          # Resolve latest python 3.12.x slim-bookworm tag via Docker Hub
          hub_url = "https://registry.hub.docker.com/v2/repositories/library/python/tags?name=3.12.&page_size=50&ordering=last_updated"
          hub_data = fetch_json(hub_url)
          slim_bw = [
              t["name"] for t in hub_data["results"]
              if re.match(r"^3\.12\.\d+-slim-bookworm$", t["name"])
          ]
          if slim_bw:
              versions["PYTHON_VERSION"] = sorted(
                  slim_bw,
                  key=lambda x: list(map(int, x.split("-")[0].split("."))),
                  reverse=True,
              )[0]

          # ── Read the current Dockerfile ───────────────────────────────────────
          with open(DOCKERFILE) as f:
              content = f.read()

          # ── Apply updates ─────────────────────────────────────────────────────
          updated = content
          changed = {}
          for arg, new_ver in versions.items():
              if new_ver is None:
                  continue
              # Match lines of the form:  ARG FOO=bar
              pattern = re.compile(rf"^(ARG {arg}=)(.+)$", re.MULTILINE)
              m = pattern.search(updated)
              if m and m.group(2) != new_ver:
                  changed[arg] = (m.group(2), new_ver)
                  updated = pattern.sub(rf"\g<1>{new_ver}", updated)

          if not changed:
              print("All versions are already up to date.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("has_changes=false\n")
              sys.exit(0)

          with open(DOCKERFILE, "w") as f:
              f.write(updated)

          summary = "\n".join(f"- `{k}`: `{old}` → `{new}`" for k, (old, new) in sorted(changed.items()))
          print("Updated versions:\n" + summary)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("has_changes=true\n")
              # Escape newlines for GITHUB_OUTPUT multiline values
              fh.write(f"summary<<SUMMARY_EOF\n{summary}\nSUMMARY_EOF\n")
          EOF

      - name: Create pull request
        if: steps.update.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `chore/update-tool-versions-${new Date().toISOString().slice(0,10)}`;
            const summary = `${{ steps.update.outputs.summary }}`;

            // Configure git
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);

            // Create and push branch
            await exec.exec('git', ['checkout', '-b', branch]);
            await exec.exec('git', ['add', '.devcontainer/Dockerfile']);
            await exec.exec('git', ['commit', '-m', 'chore: bump pinned tool versions']);
            await exec.exec('git', ['push', 'origin', branch]);

            // Open PR
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore: bump pinned tool versions (${new Date().toISOString().slice(0,10)})`,
              body: `## Automated version bump\n\nThis PR was created automatically by the **Update Tool Versions** workflow.\n\n### Changes\n\n${summary}\n\n> Review and merge to update the devcontainer image.`,
              head: branch,
              base: 'main',
            });
